version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: gym_db
    environment:
      POSTGRES_USER: ${DB_USER:-gym_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym_password}
      POSTGRES_DB: ${DB_NAME:-gym_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gym_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  # Adminer - Database Management Tool
  adminer:
    image: adminer:latest
    container_name: gym_adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - gym_network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gym_user}
      DB_PASSWORD: ${DB_PASSWORD:-gym_password}
      DB_NAME: ${DB_NAME:-gym_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev
    networks:
      - gym_network

  # Frontend (Vue + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3001}/api
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - gym_network

networks:
  gym_network:
    driver: bridge

volumes:
  postgres_data:

